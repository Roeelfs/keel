<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program state</title>
<script>
  /* Set the theme before first paint so a reload never flashes the other one. */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('state-viewer-theme'); } catch (_) {}
    var forced = new URLSearchParams(location.search).get('theme');
    var mode = forced || saved || 'auto';
    var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 14px; --radius-small: 8px;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0c0e; --surface: #121417; --raised: #191c20; --line: #22262b; --line-strong: #30353c;
    --text: #ebecee; --muted: #a3a8b0; --faint: #6f747c;
    --accent: #8db1f5; --accent-soft: rgba(141, 177, 245, .12);
    --good: #6cc89b; --good-soft: rgba(108, 200, 155, .12);
    --warn: #e2b766; --warn-soft: rgba(226, 183, 102, .11);
    --bad: #ef8a8a; --bad-soft: rgba(239, 138, 138, .12);
    --idle: #8f949c; --idle-soft: rgba(143, 148, 156, .13);
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px -18px rgba(0, 0, 0, .7);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #ffffff; --raised: #f0f0ed; --line: #e6e5e1; --line-strong: #d3d2cd;
    --text: #17181b; --muted: #575b62; --faint: #85898f;
    --accent: #2457c5; --accent-soft: rgba(36, 87, 197, .07);
    --good: #157549; --good-soft: rgba(21, 117, 73, .08);
    --warn: #8c5b00; --warn-soft: rgba(184, 125, 0, .1);
    --bad: #b42e2e; --bad-soft: rgba(180, 46, 46, .07);
    --idle: #686c73; --idle-soft: rgba(104, 108, 115, .09);
    --shadow: 0 1px 2px rgba(20, 20, 20, .04), 0 12px 32px -22px rgba(20, 20, 20, .25);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
    font: 14px/1.55 var(--sans); font-feature-settings: "tnum", "cv11"; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  code, .mono { font-family: var(--mono); font-size: .9em; }
  code { overflow-wrap: anywhere; }
  h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  button, input { font: inherit; color: inherit; }
  button { color: var(--muted); background: transparent; border: 1px solid var(--line-strong);
    border-radius: var(--radius-small); padding: 4px 11px; cursor: pointer; white-space: nowrap; transition: color .15s, background .15s; }
  button:hover { color: var(--text); background: var(--raised); }
  button[aria-pressed="true"], button[aria-selected="true"] { color: var(--text); background: var(--raised); }
  details > summary { cursor: pointer; color: var(--muted); list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "\203A"; display: inline-block; width: 1em; transition: transform .15s; color: var(--faint); }
  details[open] > summary::before { transform: rotate(90deg); }
  details > summary:hover { color: var(--text); }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap;
    padding: 12px 32px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar h1 { font: 600 15px/1.2 var(--display); letter-spacing: -.01em; }
  .bar .grow { flex: 1; }
  .bar .fresh { color: var(--faint); font-size: 12.5px; }
  .bar .fresh.stale { color: var(--warn); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-small); overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12.5px; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .tabs { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; padding: 4px 14px; font-size: 13px; border-radius: 7px; }
  .problem-chip { font-size: 12.5px; border-radius: 99px; padding: 2px 10px; border: 1px solid var(--line-strong); color: var(--muted); }
  .problem-chip.has { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 99px; font-size: 12px;
    font-weight: 550; white-space: nowrap; color: var(--idle); background: var(--idle-soft); line-height: 1.65; }
  .pill.run { color: var(--accent); background: var(--accent-soft); }
  .pill.good { color: var(--good); background: var(--good-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .new-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); margin-right: 7px; vertical-align: 1px; }

  main { max-width: 1180px; margin: 0 auto; padding: 30px 32px 72px; }
  .panel[hidden] { display: none; }
  .since { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 11px 16px; margin-bottom: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13.5px; }
  .since .what { flex: 1; min-width: 0; color: var(--muted); }
  .since .what b { color: var(--text); font-weight: 600; }
  .since.fresh-news { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), var(--surface); }
  .banner { padding: 10px 16px; margin-bottom: 14px; border-radius: var(--radius); font-size: 13.5px;
    background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
  .banner .fixes { color: var(--muted); display: block; margin-top: 3px; font-size: 12.5px; }

  .lands { padding: 26px 28px 24px; margin: 8px 0 22px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); }
  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .destination { font: 500 21px/1.36 var(--display); letter-spacing: -.016em; max-width: 64ch; }
  .goal-under { margin-top: 8px; color: var(--muted); max-width: 84ch; font-size: 13.5px; }
  .outcomes { margin-top: 20px; counter-reset: o; display: grid; gap: 2px; }
  .outcomes li { counter-increment: o; position: relative; padding: 9px 0 9px 36px; border-top: 1px solid var(--line); }
  .outcomes li:first-child { border-top: 0; }
  .outcomes li::before { content: counter(o); position: absolute; left: 0; top: 10px; width: 22px; height: 22px; border-radius: 50%;
    font: 600 11.5px/22px var(--mono); text-align: center; color: var(--muted); background: var(--raised); }
  .outcomes li.next::before { color: var(--accent); background: var(--accent-soft); }
  .outcomes .o-text { font-size: 15px; font-weight: 500; }
  .outcomes .o-ids { margin-top: 3px; font-size: 12.5px; color: var(--faint); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
  .card.ask { background: linear-gradient(0deg, var(--warn-soft), var(--warn-soft)), var(--surface);
    border-color: color-mix(in srgb, var(--warn) 32%, var(--line)); }
  section { margin-top: 22px; }
  section > h2, .card > h2 { font: 600 13.5px/1.3 var(--display); margin-bottom: 12px; display: flex; align-items: baseline; gap: 8px; }
  h2 .sub { font-weight: 400; color: var(--faint); font-size: 12.5px; }
  .card.ask > h2 { color: var(--warn); }
  .rows { display: grid; gap: 0; }
  .row { padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; }
  .rows > .row:first-child { border-top: 0; padding-top: 2px; }
  .row .main-line { font-weight: 500; }
  .row .under { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .row .ids { color: var(--faint); font-size: 12.5px; }
  .row .fix { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .row .fix code { color: var(--muted); }
  .empty { color: var(--faint); font-size: 13px; }
  .rec { color: var(--text); }
  .rec b { color: var(--warn); font-weight: 600; }

  .ladder { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
  .ladder .arrow { color: var(--faint); font-size: 11px; }
  .counts { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 14px; }
  .counts div b { display: block; font: 300 26px/1.1 var(--mono); letter-spacing: -.03em; }
  .counts div span { font-size: 12px; color: var(--muted); }
  .counts .unknown b { color: var(--warn); font-size: 18px; line-height: 1.6; }

  .diagram { border: 1px solid var(--line); border-radius: var(--radius-small); overflow: hidden; background: var(--bg); }
  .diagram iframe { display: block; width: 100%; height: 720px; border: 0; background: transparent; }
  .diagram-tools { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .diagram-tools .grow { flex: 1; }
  .diagram.explore { position: fixed; inset: 0; z-index: 30; border-radius: 0; display: flex; flex-direction: column; }
  .diagram.explore iframe { flex: 1; height: auto; }
  .view-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }

  .mods { display: grid; gap: 7px; }
  .mod { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px; align-items: center; font-size: 13px; }
  .mod .bar-wrap { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
  .mod .bar-fill { height: 100%; background: var(--accent); opacity: .7; border-radius: 3px; }
  .mod .name { overflow-wrap: anywhere; }

  .problems .row b { font-weight: 600; }
  .problems .row { border-left: 2px solid var(--warn); padding-left: 12px; border-top: 0; margin-top: 6px; }
  footer.machinery { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13px; }
  footer.machinery .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 12px 0; }
  footer.machinery dt { color: var(--faint); }
  footer.machinery dd { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--faint); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px 10px; vertical-align: top; border-top: 1px solid var(--line); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--surface); }

  .search { width: 100%; max-width: 420px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 10px;
    background: var(--surface); margin-bottom: 6px; }
  .history-note { color: var(--faint); font-size: 12.5px; margin-bottom: 8px; }
  .day { font-size: 12px; font-weight: 600; color: var(--faint); margin: 14px 0 4px; letter-spacing: .02em; }
  .hide { display: none !important; }

  .index-row .np { font: 600 14px/1.3 var(--display); white-space: nowrap; }
  .index-row .ids { white-space: nowrap; }
  .num { font-family: var(--mono); }
  .unknown-num { color: var(--warn); }

  .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100dvh; }
  .shell[hidden], .bar[hidden], main[hidden] { display: none; }
  .rail { overflow-y: auto; padding: 16px 10px 24px; border-right: 1px solid var(--line); background: var(--surface); }
  .rail h1 { font: 600 15px/1.3 var(--display); padding: 0 10px 10px; }
  .rail a.pick { display: block; padding: 8px 10px; border-radius: var(--radius-small); color: var(--text); text-decoration: none; }
  .rail a.pick:hover { background: var(--raised); }
  .rail a.pick[aria-current="page"] { background: var(--accent-soft); }
  .rail .pick-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .rail .pick-name .pill { margin-left: auto; }
  .rail .pick-line { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail .pick-line.held { color: var(--faint); }
  .shell iframe.program { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .index-pick { cursor: pointer; }
  .index-pick:hover td { background: var(--raised); }

  @media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 32vh) minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); } }
  @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } .bar { padding: 10px 18px; } main { padding: 22px 18px 56px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar" id="bar"></header>
<main id="page"></main>
<script id="state-payload" type="application/json">__STATE_PAYLOAD__</script>
<script>
(function () {
  'use strict';
  var data = JSON.parse(document.getElementById('state-payload').textContent);
  /* Shown inside the index: the index owns the reload, Live and the theme; this page reports its place to it. */
  var params = new URLSearchParams(location.search);
  var EMBED = data.kind !== 'index' && window.parent !== window && params.get('embed') === '1';
  function toIndex(msg) { if (EMBED) { msg.program = data.program; window.parent.postMessage(msg, '*'); } }

  /* Every value reaches the page through a text node, never through markup. */
  function el(tag, attrs) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') node.className = v;
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);

    for (var i = 2; i < arguments.length; i++) add(node, arguments[i]);
    return node;
  }
  function add(node, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) child.forEach(function (c) { add(node, c); });
    else node.appendChild(child.nodeType ? child : document.createTextNode(String(child)));
  }
  function pill(text, tone, title) { return el('span', { class: 'pill ' + (tone || ''), title: title || null }, text); }
  function empty(text) { return el('p', { class: 'empty' }, text); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function words(s) { s = String(s || '').replace(/[_-]+/g, ' ').trim().toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
  function ms(iso) { var t = Date.parse(iso); return isNaN(t) ? null : t; }
  function span(seconds) {

    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
    return Math.floor(s / 86400) + 'd ' + Math.floor(s % 86400 / 3600) + 'h';

  var TICKET_RE = /^[A-Z][A-Z0-9]*-\d+$/;
  function ticket(id) { var u = TICKET_RE.test(String(id)) ? ticketUrl(id) : null; return u ? ext(u, id) : el('span', { class: 'mono' }, id); }

  function idList(nodes, few) {
    few = few || 5;
    var out = [];
    nodes.slice(0, few).forEach(function (n, i) { if (i) out.push(' '); out.push(n); });
    var rest = nodes.slice(few);
    if (rest.length) {
      var tail = [];
      rest.forEach(function (n) { tail.push(' '); tail.push(n); });
      out.push(' ', el('details', { style: 'display:inline' }, el('summary', { style: 'display:inline;color:var(--accent)' }, '+' + rest.length + ' more'), tail));

    return out;
  }
  function groupBy(rows, keyOf) {
    var order = [], groups = {};
    rows.forEach(function (r) { var k = keyOf(r); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(r); });
    return order.map(function (k) { return groups[k]; });
  }
  function section(title, sub) { return el('section', null, el('h2', null, title, sub ? el('span', { class: 'sub' }, sub) : null), Array.prototype.slice.call(arguments, 2)); }
  function card(title, sub, cls) { return el('div', { class: 'card ' + (cls || '') }, el('h2', null, title, sub ? el('span', { class: 'sub' }, sub) : null), Array.prototype.slice.call(arguments, 3)); }
  function rows(list) { return el('div', { class: 'rows' }, list); }

  /* ---------- since you last looked (client side) ---------- */
  var SEEN_KEY = 'state-viewer-last-seen:' + (data.program || 'index');
  var PENDING_KEY = 'state-viewer-pending-seen:' + (data.program || 'index');
  var store = null;
  try { store = window.localStorage; store.getItem('x'); } catch (_) { store = null; }
  function navType() { try { return (performance.getEntriesByType('navigation')[0] || {}).type; } catch (_) { return null; } }
  /* Leaving the page records a candidate; a reload discards it, any other arrival commits it. */

  function dot(on) { return on ? el('span', { class: 'new-dot', title: 'New since you last looked' }) : null; }

  /* ---------- plain words ---------- */
  var STATUS = { WORKING: ['Working', 'run'], GRILLING: ['Waiting on you', 'warn'], DONE: ['Done', 'good'] };
  var FLAG = { UNBOUND: 'No one on it', READY_NOT_DISPATCHED: 'Ready, not started', STALLED: 'No live worker', BAKE_OWED: 'Bake owed' };
  var KIND = { merge: ['merged', 'merged'], deploy: ['reached prod', 'reached prod'], blocker: ['new blocker', 'new blockers'],
    question: ['new question for you', 'new questions for you'], closed: ['ticket closed', 'tickets closed'] };
  var SURFACE = {
    deployed: ['Deployed', 'good'], deploying: ['Deploying', 'run'], failed: ['Deploy failed', 'bad'],
    not_established: ['Deploy not established', 'warn'], na: ['Not affected', ''], cannot_tell: ['Cannot tell', 'warn'],
    unavailable: ['Deploys unavailable', 'warn'] };
  var ENDED = { completed: 'done', canceled: 'canceled', duplicate: 'duplicate' };
  var MAIN = { green: ['Main green', 'good'], red: ['Main red', 'bad'], outage: ['CI outage', 'bad'], pending: ['Main checking', 'run'] };
  var AWAIT = { completed: 'finished its turn', blocked: 'stopped, blocked', review_ready: 'ready for review', pr_closed: 'PR closed unmerged' };
  var NOTE = { tracker_error: 'Tracker read failed, using the cached map', tracker_rate_limited: 'Tracker rate-limited',
    tracker_unavailable: 'Tracker unavailable', no_tracker: 'No tracker command', retire_due: 'Worker due to retire',
